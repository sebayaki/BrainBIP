name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v0.2.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      release-tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Check out the verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download the verified distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brainbip-dist
          path: dist/
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Prepare release notes
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          node scripts/release.mjs notes "$RELEASE_TAG" > "$RUNNER_TEMP/brainbip-release-notes.md"
      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo 'The tag changed after verification; refusing to publish.' >&2
            exit 1
          fi
          assets=(dist/brainbip.html dist/index.html dist/VERSION.json dist/SHA256SUMS.txt dist/LICENSE dist/THIRD_PARTY_NOTICES.txt)
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != 'true' ]; then
              echo 'This release is already published. Published assets are never overwritten.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "BrainBIP $RELEASE_TAG" --notes-file "$RUNNER_TEMP/brainbip-release-notes.md"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "BrainBIP $RELEASE_TAG" --notes-file "$RUNNER_TEMP/brainbip-release-notes.md"
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
